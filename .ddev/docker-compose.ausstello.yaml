# Der Server-Abruf erreicht das Backend-DDEV ueber den Router (wie bei TYPO3).
# Backend-Host per AUSSTELLO_BACKEND_HOST in .ddev/.env umbiegbar (bin/worktree integrations),
# ohne die Datei gilt das Backend der Hauptkopie.
services:
    web:
        external_links:
            - "ddev-router:${AUSSTELLO_BACKEND_HOST:-ausstello.de.ddev.site}"
        environment:
            - AUSSTELLO_BACKEND_URL=https://${AUSSTELLO_BACKEND_HOST:-ausstello.de.ddev.site}
